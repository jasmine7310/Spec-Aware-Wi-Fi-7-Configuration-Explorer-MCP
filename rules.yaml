  - id: AO.LINK_MUST_EXIST
    title: Only remove links that still exist
    kind: harness
    status: reviewed
    applies_to: [link_remove]
    meaning: "The AP link being removed must not have been removed already."
    predicate: "link in state.ap_links; afterwards remove it from ap_links and from the STA's active links."
    sources:
      - doc: hostap
        strength: code
        location: "src/ap/hostapd.c:475-494"
        says: "hostapd_link_remove() doesn't check whether the link was already removed."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
      - doc: hostap
        strength: code
        location: "tests/hwsim/test_eht.py:1400, 1416"
        says: "The test removes link 1, then link 0."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
    examples:
      allowed:
        - "[associate, link_remove(1), link_remove(0)]"
      disallowed:
        - "[associate, link_remove(1), link_remove(1)]"
    notes:
      - "LINK_REMOVE only exists in hostapd builds with CONFIG_TESTING_OPTIONS (src/ap/hostapd.c:497)."

  - id: AO.NO_LINKS_LEFT
    title: Removing the last link disassociates the STA
    kind: harness
    status: reviewed
    applies_to: [link_remove, associate, setup_link_reconfig]
    meaning: >-
      When the AP removes the last setup link, the non-AP MLD is disassociated (802.11be
      §35.3.6.3), so every AO.ASSOC_REQUIRED action is refused until it associates again.
      The same applies when only disabled links remain (§35.3.7.5.2), and the STA can't
      associate again while that's so. We treat deleting the last link with link
      reconfiguration the same way, as our policy; no test does it. The state change comes from the standard; refusing
      the later actions is ours.
    predicate: >-
      If state.active_links becomes empty, set state.associated to false. associate needs
      at least one AP link that isn't disabled.
    sources:
      - doc: IEEE-802.11be-2024
        strength: shall
        location: "§35.3.6.3 Removing affiliated AP(s)"
        page: "PDF 517-518 (printed 516-517)"
        says: >-
          When the removed AP's link was a non-AP MLD's only setup link, the MLMEs of both
          the AP MLD and the non-AP MLD signal the disassociation of that non-AP MLD.
        checked: "Michelle, in the PDF, 2026-11-04; Claude (AI agent), PDF text, 2026-11-02"
      - doc: IEEE-802.11be-2024
        strength: shall
        location: "§35.3.7.5.2 Affiliated AP link disablement"
        page: "PDF 532-534"
        says: >-
          After an advertised TTLM's Mapping Switch Time, the MLME of a non-AP MLD whose setup
          links are all on disabled links signals its disassociation, and a STA that isn't
          associated doesn't send (Re)association Requests on a disabled link. hostap's
          mld_indicate_disabled is a static setting, not that TTLM procedure.
        checked: "Michelle, in the PDF, 2026-11-04"
      - doc: hostap
        strength: code
        location: "tests/hwsim/test_eht.py:1416-1424"
        says: "After removing the last link the test expects traffic to fail."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
    examples:
      allowed:
        - "[associate, link_remove(1), link_remove(0)] (ends there)"
      disallowed:
        - "[associate, link_remove(1), link_remove(0), rekey_gtk_now]"
        - "[associate, link_remove(0), associate] while link 1 is advertised as disabled"
        - "[associate, setup_link_reconfig delete=1, setup_link_reconfig delete=0, rekey_gtk_now]"
    notes:
      - >-
        Seen in runs/smoke/1793690892 (eht_mld_link_removal): after the last link's
        removal the STA logs CTRL-EVENT-DISCONNECTED (reason 4, locally generated) and
        rescans, before the test ends. Consistent with §35.3.6.3; the log doesn't say why.

  - id: AO.RECONFIG_DELETE_ACTIVE
    title: Link reconfig can only delete a current link
    kind: harness
    status: reviewed
    applies_to: [setup_link_reconfig]
    meaning: "setup_link_reconfig delete=<link> needs the link to be one of the STA's current links."
    predicate: "link in state.active_links; afterwards remove it."
    sources:
      - doc: hostap
        strength: code
        location: "wpa_supplicant/ctrl_iface.c:12847-12853"
        says: "Fails with 'not a valid delete link' (hostap code)."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
      - doc: hostap
        strength: code
        location: "tests/hwsim/test_eht.py:3024, 3034"
        says: "The test deletes a current link."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
    examples:
      allowed:
        - "[associate, setup_link_reconfig delete=1]"
      disallowed:
        - "[associate, setup_link_reconfig delete=1, setup_link_reconfig delete=1]"

  - id: AO.RECONFIG_ADD_ABSENT
    title: Link reconfig adds only links the STA doesn't have
    kind: harness
    status: reviewed
    applies_to: [setup_link_reconfig]
    meaning: >-
      setup_link_reconfig add=<link> needs the AP MLD to advertise the link, the STA not to
      have it, and the link not to be advertised as disabled.
    predicate: "link in state.ap_links, not in state.active_links and not disabled; afterwards add it."
    exceptions:
      - "Only the first half is checked by hostap code; 'the STA doesn't have it' is our policy, wpa_supplicant doesn't check it."
      - "Refusing a disabled link is also our policy, from §35.3.7.5.2's rule that an associated STA doesn't use a disabled link to send to its AP."
    sources:
      - doc: hostap
        strength: code
        location: "wpa_supplicant/ctrl_iface.c:12819-12830"
        says: "Fails with 'add link info not present' if the AP MLD doesn't advertise the link (hostap code)."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
      - doc: hostap
        strength: code
        location: "tests/hwsim/test_eht.py:3024, 3044, 3054"
        says: "The test deletes a link, adds the same link back and checks CTRL-EVENT-LINK-STA-ADDED."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
    examples:
      allowed:
        - "[associate, setup_link_reconfig delete=1, setup_link_reconfig add=1]"
      disallowed:
        - "[associate, setup_link_reconfig add=1] while link 1 is still active"
        - "[associate, setup_link_reconfig add=1] while link 1 is advertised as disabled"

  - id: AO.RECONNECT_AFTER_DISCONNECT
    title: RECONNECT only after DISCONNECT
    kind: harness
    status: reviewed
    applies_to: [sta_disconnect_reconnect]
    meaning: "RECONNECT only has an effect after DISCONNECT; otherwise it silently does nothing."
    predicate: "state.disconnected_by_command before RECONNECT; afterwards associated once the reconnect completes."
    sources:
      - doc: hostap
        strength: code
        location: "wpa_supplicant/ctrl_iface.c:13925-13929"
        says: >-
          RECONNECT fails if the interface is disabled; otherwise it replies OK but does nothing
          unless wpa_s->disconnected is set. DISCONNECT sets it (wpa_supplicant/wpa_supplicant.c:10559),
          as do a few paths we don't model, such as wpa_supplicant/events.c:5381.
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
      - doc: hostap
        strength: code
        location: "tests/hwsim/test_eht.py:740, 760, 1170, 1181"
        says: "The tests use DISCONNECT then RECONNECT."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
    examples:
      allowed:
        - "[associate, DISCONNECT, RECONNECT]"
      disallowed:
        - "[associate, RECONNECT]"

  - id: AO.ENABLE_AFTER_DISABLE
    title: ENABLE_MLD only after DISABLE_MLD
    kind: harness
    status: reviewed
    applies_to: [disable_enable_mld]
    meaning: >-
      ENABLE_MLD follows DISABLE_MLD. While the AP MLD is disabled the STA must be
      disconnected with DISCONNECT before the AP is re-enabled, and reconnected with
      RECONNECT afterwards.
    predicate: "state.ap_enabled is false before ENABLE_MLD, and true before DISABLE_MLD, associate and RECONNECT."
    sources:
      - doc: hostap
        strength: code
        location: "tests/hwsim/test_eht.py:728-748, 760"
        says: >-
          A comment says mac80211 doesn't seem to detect beacon loss or deauthentication for a
          non-AP MLD, so the test forces DISCONNECT before ENABLE_MLD, then RECONNECT after it.
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
      - doc: hostap
        strength: code
        location: "src/ap/hostapd.c:3671-3675"
        says: >-
          ENABLE_MLD reaches hostapd_enable_iface() (hostapd/ctrl_iface.c:3652), which fails with
          "already enabled" on an interface that is already up. So hostap code enforces ENABLE_MLD
          following DISABLE_MLD; the DISCONNECT / RECONNECT order is harness. Read, not run.
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04; accepted by Michelle"
      - doc: hostap
        strength: code
        location: "src/ap/hostapd.c:3754-3757"
        says: "hostapd_disable_iface() fails with \"already disabled\" on an interface that is already down. Read, not run."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-04"
    examples:
      allowed:
        - "[associate, DISABLE_MLD, DISCONNECT, ENABLE_MLD, RECONNECT]"
      disallowed:
        - "[associate, ENABLE_MLD]"
        - "[DISABLE_MLD, DISABLE_MLD]"
        - "[DISABLE_MLD, associate]"
        - "[associate, DISABLE_MLD, ENABLE_MLD, rekey_gtk_now]"
  - id: AO.BSS_TM_NEEDS_BSS_TRANSITION
    title: A BSS TM request needs the AP to advertise BSS transition
    kind: harness
    status: draft
    applies_to: [bss_tm_link_removal_imminent, ap_bss_transition]
    meaning: >-
      bss_tm_link_removal_imminent is only admitted when the AP has bss_transition on, as in
      the only test that sends it. hostap sends the request either way, but without the
      setting the AP doesn't advertise BSS transition support.
    predicate: "ap.bss_transition is true before bss_tm_link_removal_imminent."
    exceptions:
      - "The test also sets mbo=1, which explorer.model doesn't have."
    sources:
      - doc: hostap
        strength: code
        location: "tests/hwsim/test_eht.py:1438-1439"
        says: "test_eht_mld_bss_trans_mgmt_link_removal_imminent sets bss_transition=1 and mbo=1 before its BSS_TM_REQ."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-05"
      - doc: hostap
        strength: code
        location: "src/ap/wnm_ap.c:959-977"
        says: "wnm_send_bss_tm_req() doesn't check bss_transition, so hostap sends the request either way."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-05"
      - doc: hostap
        strength: code
        location: "src/ap/ieee802_11_shared.c:393"
        says: "bss_transition sets the BSS Transition bit the AP advertises in its Extended Capabilities."
        checked: "Claude (AI agent), at the pinned commit, 2026-11-05"
    examples:
      allowed:
        - "[associate, bss_tm_link_removal_imminent] with bss_transition on (eht_mld_bss_trans_mgmt_link_removal_imminent)"
      disallowed:
